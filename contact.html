<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nihaal's Portfolio - Contact</title>
    <link rel="stylesheet" href="styles.css">
    <nav class="navbar" style="display: flex; justify-content: flex-end; padding-bottom: 10px;"> 
        <label> 
            <a href="index.html" style="position: fixed; left: 20px; vertical-align: middle;">Home</a>
            <a href="contact.html" style="position: fixed; left: 80px; vertical-align: middle;">Contact</a>
            <span style="position: fixed; right: 57px; top: 15px; font-size: 26px;"><strong>Goofy Mode?</strong></span> 
            <input style="position: fixed; right: 20px; top: 15px;" type="checkbox" id="goofy-checkbox">
        </label> 
    </nav> 
</head>
<body>
    <main>
        <h1 style="background-image: linear-gradient(#006eff, #9c2ee5);">Contact</h1>

        <form>
            <label for="firstname">First Name</label>
            <input type="text" id="firstname" name="firstname" placeholder="Your name">

            <label for="lastname">Last Name</label>
            <input type="text" id="lastname" name="lastname" placeholder="Your last name">

            <label for="message">Message</label>
            <input type="text" id="message" name="message" placeholder="Message">

            <input type="submit" id="submit-button" name="submit" style="color: black;">
        </form>
    </main>
