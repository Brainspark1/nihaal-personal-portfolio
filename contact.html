<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nihaal's Portfolio - Contact</title>
    <link rel="stylesheet" href="styles.css">
    <nav class="navbar" style="display: flex; justify-content: flex-end; padding-bottom: 10px;"> 
        <label> 
            <a href="index.html" style="position: fixed; left: 20px; vertical-align: middle;">Home</a>
            <a href="skills.html" style="position: fixed; left: 105px; vertical-align: middle;">Skills</a>
            <a href="contact.html" style="position: fixed; left: 212px; vertical-align: middle;">Contact</a>
            <span style="position: fixed; right: 57px; top: 15px; font-size: 26px;"><strong>Goofy Mode?</strong></span> 
            <input style="position: fixed; right: 20px; top: 15px;" type="checkbox" id="goofy-checkbox">
        </label> 
    </nav> 
</head>
<body>
    <main>
        <h1 style="background-image: linear-gradient(#FBD3E9, #BB377D);">Contact</h1>

        <form id="contact-form">
            <label for="firstname" style="animation-delay: 0s;">First Name</label>
            <input type="text" id="firstname" name="firstname" placeholder="Your name">

            <label for="lastname" style="animation-delay: 1s;">Last Name</label>
            <input type="text" id="lastname" name="lastname" placeholder="Your last name">

            <label for="message" style="animation-delay: 2s;">Message</label>
            <textarea type="text" id="message" name="message" placeholder="What's up?" rows="1"></textarea>

            <p>What kind of help do you need from me?</p>

            <div class="help-radio">
                <input type="radio" id="coding-help" name="help">
                <label for="coding-help" style="animation-delay: 0s">Coding Help</label>
            </div>
            <div class="help-radio">
                <input type="radio" id="math-help" name="help">
                <label for="math-help" style="animation-delay: 1s">Math Help</label>
            </div>
            <div class="help-radio">
                <input type="radio" id="chess-help" name="help">
                <label for="chess-help" style="animation-delay: 2s">Chess Help</label>
            </div>
            <div class="help-radio">
                <input type="radio" id="other-help" name="help">
                <label for="other-help" style="animation-delay: 3s">Other Help</label>
            </div>

            <input type="submit" id="submit-button" name="submit-button" style="color: black;">
        </form>

        <h2>Direct Contact</h2>
        <p>Feel free to also directly reach out to me at <a id="mail-link" href="mailto:brainsparkteam@gmail.com"><img id="email-image" src="emailIcon.webp" alt="email icon">brainsparkteam@gmail.com</a> with any questions.</p>
    </main>
    <script src="app.js"></script>
</body>
</html>
